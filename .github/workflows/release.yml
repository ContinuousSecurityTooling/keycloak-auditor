name: Create release
run-name: Release ${{ inputs.release_type == 'custom' && inputs.custom_version || inputs.release_type }}

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release to build (base: the pom version without -SNAPSHOT)'
        type: choice
        default: patch
        options: [patch, minor, major, custom]
      custom_version:
        description: "Version to release (only used when release_type is 'custom', e.g. 1.2.3)"
        type: string
        required: false
      draft_release:
        description: 'Create the GitHub release as a draft'
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Version bump (pom + sdk/package.json), changelog, signed deploy to Maven Central,
  # next -SNAPSHOT, push and GitHub release.
  release:
    uses: m13tLabs/gh-actions-templates/.github/workflows/maven-release.yml@main
    with:
      release_type: ${{ inputs.release_type }}
      custom_version: ${{ inputs.custom_version }}
      client_id: ${{ vars.CI_CLIENT_ID }}
      default_branch: develop
      java_version: '21.0.13+100000002.0.LTS'
      maven_args: '-Pcentral-publish -DskipTests -DskipITs'
      bump_command: |
        cd sdk
        npm version --no-git-tag-version --allow-same-version "$RELEASE_VERSION"
        grep -q "\"version\": \"$RELEASE_VERSION\"" package.json
      draft_release: ${{ inputs.draft_release }}
    # `secrets: inherit` doesn't cross organizations (template lives in m13tLabs)
    secrets:
      CI_PRIVATE_KEY: ${{ secrets.CI_PRIVATE_KEY }}
      OSS_SONATYPE_USER: ${{ secrets.OSS_SONATYPE_USER }}
      OSS_SONATYPE_PASS: ${{ secrets.OSS_SONATYPE_PASS }}
      OSS_SONATYPE_GPG_PRIVATE_KEY: ${{ secrets.OSS_SONATYPE_GPG_PRIVATE_KEY }}
      OSS_SONATYPE_GPG_PASSPHRASE: ${{ secrets.OSS_SONATYPE_GPG_PASSPHRASE }}

  # Built from the release commit: the draft release has no tag yet, and the branch head
  # is already the next -SNAPSHOT.
  publish:
    name: Publish SDK and release assets
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
      id-token: write # npm trusted publishing / provenance
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.release_sha }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21.0.13+100000002.0.LTS"
          cache: "maven"

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - name: Build SPI, OpenAPI and SBOM
        run: |
          ./mvnw -B -ntp clean package -DskipTests -DskipITs
          ./mvnw -B -ntp cyclonedx:makeAggregateBom

      - name: Publish npm package
        working-directory: sdk
        run: |
          npm run clean
          npm run build
          npm publish

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.release.outputs.release_version }}
        run: |
          cp target/dependency-bom.xml keycloak-auditor-dependency-bom.xml
          cp target/dependency-bom.json keycloak-auditor-dependency-bom.json
          cp spi/target/keycloak-auditor-spi.jar keycloak-auditor-spi.jar
          cp spi/target/openapi/openapi.yaml keycloak-auditor-openapi.yaml
          cp spi/target/openapi/openapi.json keycloak-auditor-openapi.json
          gh release upload "v$RELEASE_VERSION" --clobber \
            keycloak-auditor-dependency-bom.xml \
            keycloak-auditor-dependency-bom.json \
            keycloak-auditor-spi.jar \
            keycloak-auditor-openapi.yaml \
            keycloak-auditor-openapi.json
